# Domain/cert paths below are specific to this deployment
# (43-204-227-119.nip.io) — update both if the domain ever changes.

server {
    listen 80;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge — must stay reachable over plain
    # HTTP even with HTTPS enforced below, since certbot renewal
    # re-solves this challenge on port 80 each time.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/43-204-227-119.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43-204-227-119.nip.io/privkey.pem;

    # Matches backend/.env's MAX_WHATSAPP_UPLOAD_SIZE_MB default (15MB) —
    # bump both together if that limit ever changes.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the browser sees frontend and backend as
    # the same origin — no CORS preflight, and the auth cookie is a
    # simple same-site cookie instead of a cross-origin one.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Text Chat's reply and the WhatsApp upload response are both
        # text/event-stream — without this, nginx buffers the whole
        # response before forwarding it, defeating token-by-token
        # streaming (and, on a slow free-tier model response, risking
        # the client just seeing a stalled connection).
        proxy_buffering off;
        proxy_read_timeout 150s;
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
