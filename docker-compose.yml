services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Not published to the host — nginx (frontend service) is the only
    # public entry point and reverse-proxies /api/ to this container.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_VAPI_PUBLIC_KEY: "${VITE_VAPI_PUBLIC_KEY:-}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
